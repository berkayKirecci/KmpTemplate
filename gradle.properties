#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4096M

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

#Project
# Base identifier for the whole template: drives the Android namespace of every
# module, the Gradle group, the swiftPMImport package and the app id.
# Change this one value when starting a project from this template.
kmptemplate.applicationId=com.example.kmptemplate
